name: Update Total Commits

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get total commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          START_YEAR=2000
          END_YEAR=$(date +%Y)
          TOTAL=0

          for YEAR in $(seq $START_YEAR $END_YEAR); do
            FROM="${YEAR}-01-01T00:00:00Z"
            TO="$((YEAR + 1))-01-01T00:00:00Z"

            COUNT=$(gh api graphql \
              -f query='
                query($login: String!, $from: DateTime!, $to: DateTime!) {
                  user(login: $login) {
                    contributionsCollection(from: $from, to: $to) {
                      totalCommitContributions
                    }
                  }
                }
              ' \
              -F login=AC1DST4R \
              -F from="$FROM" \
              -F to="$TO" \
              --jq '.data.user.contributionsCollection.totalCommitContributions')

            TOTAL=$((TOTAL + COUNT))
          done

          echo "Total commits: $TOTAL"

          cat > commits.json <<EOF
          {
            "schemaVersion": 1,
            "label": "TOTAL COMMITS",
            "message": "$TOTAL",
            "color": "red"
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add commits.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update total commit count"
            git push
          fi
