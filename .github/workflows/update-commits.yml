name: Update Total Commits

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate total commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=0

          for YEAR in $(seq 2000 $(date +%Y)); do
            FROM="${YEAR}-01-01T00:00:00Z"
            TO="$((YEAR + 1))-01-01T00:00:00Z"

            COUNT=$(gh api graphql \
              -f query='
                query($login: String!, $from: DateTime!, $to: DateTime!) {
                  user(login: $login) {
                    contributionsCollection(from: $from, to: $to) {
                      totalCommitContributions
                    }
                  }
                }
              ' \
              -f login="AC1DST4R" \
              -f from="$FROM" \
              -f to="$TO" \
              --jq '.data.user.contributionsCollection.totalCommitContributions')

            if [ -n "$COUNT" ]; then
              TOTAL=$((TOTAL + COUNT))
            fi

            echo "$YEAR: $COUNT commits"
          done

          echo "=========================="
          echo "TOTAL COMMITS: $TOTAL"
          echo "=========================="

          cat > commits.json <<EOF
          {
            "schemaVersion": 1,
            "label": "TOTAL COMMITS",
            "message": "$TOTAL",
            "color": "red"
          }
          EOF

      - name: Commit updated count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add commits.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update total commit count"
            git push
          fi
