name: Update Commit Count

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get commit count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh api "users/AC1DST4R/repos?per_page=100" --paginate --jq '.[].name' | while read repo; do
            gh api "repos/AC1DST4R/$repo/commits?author=AC1DST4R&per_page=100" --paginate --jq '.[] | .sha'
          done | sort -u | wc -l)

          cat > commits.json <<EOF
          {
            "schemaVersion": 1,
            "label": "TOTAL COMMITS",
            "message": "$COUNT",
            "color": "red"
          }
          EOF

      - name: Commit updated count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commits.json
          git commit -m "Update commit count" || exit 0
          git push
